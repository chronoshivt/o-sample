name: Release

# Builds a standalone executable for every supported platform and attaches them
# to a GitHub Release. Triggered by pushing a version tag (e.g. `v0.1.0`), or
# run manually to test the build matrix without publishing a release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
            binary: o-sample
          # Intel-mac binary is cross-compiled on the Apple Silicon runner —
          # GitHub's macos-13 (Intel) runners are deprecated and queue for ages.
          - os: macos-14
            target: darwin-x64
            binary: o-sample
            target_arch: x64
          - os: ubuntu-latest
            target: linux-x64
            binary: o-sample
          - os: ubuntu-24.04-arm
            target: linux-arm64
            binary: o-sample
          - os: windows-latest
            target: win32-x64
            binary: o-sample.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Build executable
        run: npm run build:exe
        env:
          # Authenticates the ffmpeg-static release lookup in vendor-fetch.ts so
          # it isn't throttled by the shared-runner unauthenticated rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty for native builds; "x64" tells build-exe.ts to cross-compile
          # the Intel-mac artifact on this arm64 runner.
          BUILD_TARGET_ARCH: ${{ matrix.target_arch }}

      # Rename the host-named output (o-sample / o-sample.exe) to a
      # platform-qualified asset name so all five can coexist on one release,
      # and emit a SHA256 sidecar so downloaders can verify integrity.
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p out
          ext=""
          if [ "${{ matrix.binary }}" = "o-sample.exe" ]; then ext=".exe"; fi
          asset="o-sample-${{ matrix.target }}${ext}"
          cp "dist/${{ matrix.binary }}" "out/${asset}"
          cd out
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${asset}" > "${asset}.sha256"
          else
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: o-sample-${{ matrix.target }}
          path: out/*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true
